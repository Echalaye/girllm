<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>girllm</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="/styles.css" />
    <script type="module" src="/app.js"></script>
  </head>
  <body>
    <header class="topbar">
      <h1 class="brand">girllm</h1>
      <select id="character-select" aria-label="Character"></select>
      <select id="session-select" aria-label="Chat"></select>
      <button id="new-chat" type="button">New chat</button>
      <button id="delete-chat" class="danger" type="button" title="Delete this chat">Delete</button>
      <button id="open-memory" type="button" hidden>Memory</button>
      <button id="voice-toggle" type="button" aria-pressed="false" title="Read her replies aloud" hidden>
        🔈 Voice off
      </button>
      <span id="status" class="status" role="status" aria-live="polite"></span>
    </header>

    <main id="messages" class="messages" aria-live="polite"></main>

    <form id="composer" class="composer" autocomplete="off">
      <textarea
        id="input"
        rows="2"
        maxlength="8000"
        placeholder="Write a message… (Enter to send, Shift+Enter for a new line)"
        aria-label="Message"
      ></textarea>
      <div class="actions">
        <button id="mic" type="button" title="Talk (click again to send)" aria-label="Record a voice message" hidden>
          🎤
        </button>
        <button id="photo" type="button" aria-label="Ask for a photo" hidden>📷</button>
        <button id="regenerate" type="button" title="Generate another reply">↻</button>
        <button id="stop" type="button" hidden>Stop</button>
        <button id="send" type="submit">Send</button>
      </div>
    </form>

    <dialog id="memory-dialog" class="memory-dialog" aria-labelledby="memory-title">
      <header class="dialog-head">
        <h2 id="memory-title">Memory</h2>
        <button id="close-memory" type="button" aria-label="Close">✕</button>
      </header>

      <section>
        <h3>Story so far <small>(this chat)</small></h3>
        <p id="memory-summary" class="muted"></p>
        <p id="memory-mood" class="muted"></p>
      </section>

      <section>
        <h3>Long-term memories <small>(shared by every chat with this character)</small></h3>
        <form id="memory-form" class="memory-form" autocomplete="off">
          <select id="memory-category" aria-label="Category">
            <option value="user">About you</option>
            <option value="character">About her</option>
            <option value="relationship">Relationship</option>
            <option value="event">Event</option>
          </select>
          <input
            id="memory-content"
            maxlength="300"
            minlength="3"
            required
            placeholder="Add something she should remember…"
            aria-label="New memory"
          />
          <button type="submit">Add</button>
        </form>
        <ul id="memory-list" class="memory-list"></ul>
      </section>
    </dialog>
  </body>
</html>
